name: Aggiornamento Calendario Esami LIUC

on:
  workflow_dispatch:
  schedule:
    # 6 esecuzioni al giorno ai minuti :17 (evita code dei runner al minuto :00)
    - cron: '17 0,4,8,12,16,20 * * *'

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout esplicito con GITHUB_TOKEN per triggerare il deploy automatico di GitHub Pages
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      # 2. Setup ambiente Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installazione dipendenze minime richieste
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml icalendar tzdata

      # 4. Esecuzione Scraper (se fallisce, il workflow si arresta qui senza toccare il file .ics)
      - name: Run Scraper and Generate ICS
        run: python scraper.py

      # 5. Commit e Push sincronizzato con rebase
      - name: Commit and Push new ICS file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add appelli_liuc.ics

          if git diff --staged --quiet; then
            echo "Nessuna variazione negli appelli o nelle scadenze. Salto il commit."
          else
            git commit -m "Auto-update: Sincronizzazione appelli esami e scadenze"
            git pull --rebase origin main
            git push
          fi
